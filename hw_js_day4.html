<!-- You are creating a simple game result generator for a beginner-level web game.
Create a script that:
Randomly picks a number between 1 and 50 (representing a mystery level).
Takes a user input score (as a string, e.g., "45") and converts it into a number.
Shows the absolute difference between the mystery level and the user's score.
Calculates and logs the square root of the user’s score.
Logs the value of Pi (?) using a math property.
Uses implicit conversion to multiply the string "20" by 5.
Uses the Math.max() and Math.min() methods to display the highest and lowest values among 10, 20, and the mystery level. -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HW JS DAY 4</title>
</head>
<body>
    <script>
        let random = Math.floor(Math.random() * 50) + 1;
        let inputscore="45";
        let numeric=Number(inputscore);
        let absdifference = Math.abs(random - numeric);
        let sqrt=Math.sqrt(numeric);
        let pivalue=Math.PI;
        let implicit="20"*5;
        let highestvalue = Math.max(10, 20, random);
        let lowestvalue = Math.min(10, 20, random);

        console.log("Randomly picked number:", random);
        console.log("User Score (String):", inputscore);
        console.log("Numeric Score:", numeric);
        console.log("Difference:", absdifference);
        console.log("Square Root of Score:", sqrt);
        console.log("Value of Pi:", pivalue);
        console.log('Implicit Conversion ("20" * 5):', implicit);
        console.log("Highest Value:", highestvalue);
        console.log("Lowest Value:", lowestvalue);
    </script>
</body>
</html>
